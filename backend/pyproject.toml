[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "coverage>=7.16.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "paho-mqtt>=2.1.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
