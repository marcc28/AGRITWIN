<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - AgriTwin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .message {
            font-size: 18px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 110px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            overflow-wrap: anywhere;
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Welcome!</h2>

        <div class="message">Authentication successful!</div>
        <div class="message">Welcome, {{ name }}!</div>

        {% if access_token %}
        <h3>Your AgriTwin Access Token</h3><label for="token">Access Token</label>
        <textarea id="token" name="token" readonly>{{ access_token }}</textarea>
        <button onclick="copyToken()">Copy token</button>
        {% else %}
        <p>No access token found.</p>
        {% endif %}
    </div>

    <script>
        function copyToken() {
            const token = document.getElementById("token");
            token.select();
            navigator.clipboard.writeText(token.value);
            alert("Token copied!");
        }
    </script>
</body>

</html>
