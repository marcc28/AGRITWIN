
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contrasenya - AGRITWIN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #3b7d45;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #3b7d45;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #30683a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AGRITWIN</h1>
        <h2>Recuperació de contrasenya</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% else %}
            <p>Introdueix la teva nova contrasenya.</p>

            <form id="resetForm">
                <input
                    type="hidden"
                    id="secret_token"
                    value="{{ token }}"
                >

                <label for="new_password">
                    Nova contrasenya
                </label>

                <input
                    type="password"
                    id="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm_password">
                    Confirma la contrasenya
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="submitButton">
                    Canviar contrasenya
                </button>
            </form>

            <p id="message"></p>
        {% endif %}
    </div>

    {% if not error %}
    <script>
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const token = document.getElementById("secret_token").value;
            const password = document.getElementById("new_password").value;
            const confirmPassword =
                document.getElementById("confirm_password").value;

            if (password !== confirmPassword) {
                message.className = "error";
                message.textContent =
                    "Les contrasenyes no coincideixen.";
                return;
            }

            button.disabled = true;
            button.textContent = "Actualitzant...";

            try {
                const response = await fetch(
                    "/api/v1/password/reset-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            secret_token: token,
                            new_password: password,
                            confirm_password: confirmPassword
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "No s'ha pogut canviar la contrasenya."
                    );
                }

                message.className = "success";
                message.textContent =
                    "Contrasenya actualitzada correctament!";

                form.reset();

            } catch (error) {
                message.className = "error";
                message.textContent = error.message;

            } finally {
                button.disabled = false;
                button.textContent = "Canviar contrasenya";
            }
        });
    </script>
    {% endif %}
</body>
</html>
