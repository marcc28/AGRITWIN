
sonar.projectKey=marcc28_AGRITWIN
sonar.organization=marcc28
sonar.sourceEncoding=UTF-8

# Directories
sonar.sources=backend,agritwin-app
sonar.tests=backend/tests,agritwin-app/__tests__,agritwin-app/e2e

# Exclude dependencies, generated files and test files from source analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.expo/**,**/ios/Pods/**,.github/**,backend/tests/**,agritwin-app/__tests__/**,agritwin-app/e2e/**,agritwin-app/scripts/*,backend/Dockerfile,backend/docker-compose.yaml,**/PRIVACY.md,**/SECURITY.md,iot/**,docs/**,backend/main.py,**/.gitignore,**/_layout.tsx,agritwin-app/src/styles


# Exclude test files from coverage calculations
sonar.coverage.exclusions=backend/tests/**,agritwin-app/__tests__/**,agritwin-app/e2e/**,agritwin-app/src/styles/**,agritwin-app/i18n/**
# Coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=agritwin-app/coverage/lcov.info

# Migrations contain seed data (many INSERT rows with the same structure): not real code duplication
sonar.cpd.exclusions=backend/migrations/**
