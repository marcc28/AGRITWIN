
sonar.projectKey=marcc28_AGRITWIN
sonar.organization=marcc28
sonar.sourceEncoding=UTF-8

# Directories
sonar.sources=backend,agritwin-app
sonar.tests=backend/tests,agritwin-app/__tests__,agritwin-app/e2e

# Exclude dependencies, generated files and test files
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.expo/**,**/ios/Pods/**,**/.venv/**,**/__pycache__/**,**/.github/**,backend/tests/**,agritwin-app/__tests__/**,agritwin-app/e2e/**

# Exclude test files from coverage calculations
sonar.coverage.exclusions=backend/tests/**,agritwin-app/__tests__/**,agritwin-app/e2e/**

# Coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=agritwin-app/coverage/lcov.info
