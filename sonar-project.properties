sonar.projectKey=marcc28_AGRITWIN
sonar.organization=marcc28

sonar.sources=.

# Exclude build artifacts and unit test files themselves from coverage target
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.expo/**,**/ios/Pods/**
sonar.coverage.exclusions=backend/tests/**,agritwin-app/**

# Path to the XML coverage report generated by pytest
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8