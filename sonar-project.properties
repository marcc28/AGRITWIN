sonar.projectKey=marcc28_AGRITWIN
sonar.organization=marcc28

sonar.sources=.

# Exclude build folders, GitHub workflows, and unit tests from source scan
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.expo/**,**/ios/Pods/**,.github/**,backend/tests/**
sonar.coverage.exclusions=backend/tests/**,agritwin-app/**

# Path to the XML coverage report generated by pytest
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8