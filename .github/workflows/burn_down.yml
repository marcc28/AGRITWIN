name: Generate project progress charts

on:
  workflow_dispatch:
  push:
  schedule:
    # Cada dia a les 06:17 UTC
    - cron: "17 6 * * *" 

permissions:
  contents: write
  issues: read

concurrency:
  group: project-progress-charts
  cancel-in-progress: false

jobs:
  generate-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            ref: ${{ github.head_ref || github.ref_name }}
            fetch-depth: 0
            token: ${{ github.token }}
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install matplotlib numpy scipy requests        
      - name: Generate burn up and burn down charts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SPRINT_START_DATE: "2026-09-30"
          SPRINT_END_DATE: "2026-10-21"

        run: python .github/scripts/generate_progress_charts.py

      - name: Commit charts and history
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add docs/progress/

            if git diff --cached --quiet; then
            echo "No changes detected."
            else
            git commit -m "docs: update burn charts"
            git push origin HEAD:${GITHUB_REF_NAME}
            fi
      - name: Upload burn up and burn down charts
        uses: actions/upload-artifact@v4
        with:
            name: project-progress-charts
            path: docs/progress/*.svg
            if-no-files-found: error
            retention-days: 30