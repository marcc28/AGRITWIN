name: Generate cost reports

on:
  workflow_dispatch:
    inputs:
      commit_csv:
        description: Commit reports/costes.csv to the repository
        required: false
        type: boolean
        default: true
  issues:
    types:
      - opened
      - edited
      - deleted
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - field_added
      - field_removed
  schedule:
    - cron: "17 5 * * *"
      timezone: "Europe/Madrid"

concurrency:
  group: generate-costs-csv
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PROJECT_TITLE: AGRITWIN
      OUTPUT_CSV: reports/costes.csv
      OUTPUT_XLSX: reports/costes.xlsx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Latest commit of the branch when the job starts. Without it an
          # issue event checks out the commit of the moment the event fired,
          # which can miss the reports pushed by the previous run.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel dependency
        run: python -m pip install openpyxl==3.1.5

      - name: Generate CSV
        run: python scripts/generate_costs_csv.py

      - name: Upload cost reports
        uses: actions/upload-artifact@v4
        with:
          name: project-costs
          path: |
            reports/costes.csv
            reports/costes.xlsx
          if-no-files-found: error

      - name: Commit updated CSV
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_csv }}
        run: |
          if [ -z "$(git status --porcelain -- reports/costes.csv reports/costes.xlsx)" ]; then
            echo "Cost reports are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$(git branch --show-current)"

          # The reports are generated from scratch, so this run's files are
          # always the newest ones. If dev moved while the job was running,
          # start again from the latest dev and put the new reports on top
          # (a rebase cannot merge the binary .xlsx file).
          mkdir -p "$RUNNER_TEMP/reports"
          cp reports/costes.csv reports/costes.xlsx "$RUNNER_TEMP/reports/"

          for attempt in 1 2 3; do
            git fetch --quiet origin "$branch"
            git reset --quiet --hard "origin/$branch"
            cp "$RUNNER_TEMP/reports/costes.csv" "$RUNNER_TEMP/reports/costes.xlsx" reports/
            git add reports/costes.csv reports/costes.xlsx
            if git diff --cached --quiet; then
              echo "Cost reports are already up to date"
              exit 0
            fi
            git commit --quiet -m "chore: update project costs [skip ci]"
            git push --quiet origin "HEAD:$branch" && exit 0
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
