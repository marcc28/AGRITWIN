name: Generate cost reports

on:
  workflow_dispatch:
    inputs:
      commit_csv:
        description: Commit reports/costes.csv to the repository
        required: false
        type: boolean
        default: true
  issues:
    types:
      - opened
      - edited
      - deleted
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - field_added
      - field_removed
  schedule:
    - cron: "17 5 * * *"
      timezone: "Europe/Madrid"

concurrency:
  group: generate-costs-csv
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PROJECT_TITLE: AGRITWIN
      OUTPUT_CSV: reports/costes.csv
      OUTPUT_XLSX: reports/costes.xlsx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel dependency
        run: python -m pip install openpyxl==3.1.5

      - name: Generate CSV
        run: python scripts/generate_costs_csv.py

      - name: Upload cost reports
        uses: actions/upload-artifact@v4
        with:
          name: project-costs
          path: |
            reports/costes.csv
            reports/costes.xlsx
          if-no-files-found: error

      - name: Commit updated CSV
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_csv }}
        run: |
          if [ -z "$(git status --porcelain -- reports/costes.csv reports/costes.xlsx)" ]; then
            echo "Cost reports are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/costes.csv reports/costes.xlsx
          git commit -m "chore: update project costs [skip ci]"
          git push
