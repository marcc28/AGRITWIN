name: Generar CSV de costes

on:
  workflow_dispatch:

  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - assigned
      - unassigned
      - field_added
      - field_removed

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: generate-costs-csv
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar CSV
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_costs_csv.py

      - name: Publicar CSV como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: costes-proyecto
          path: reports/costes.csv
          if-no-files-found: error

      - name: Guardar CSV en el repositorio
        run: |
          if [ -z "$(git status --porcelain -- reports/costes.csv)" ]; then
            echo "El CSV ya está actualizado"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/costes.csv
          git commit -m "chore: actualizar costes [skip ci]"
          git push
