name: Sprint 1 Burndown

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *'
      timezone: 'Europe/Madrid'
  issues:
    types: [opened, closed, reopened, milestoned, demilestoned, labeled, unlabeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: sprint-1-burndown
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Generate burndown chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINT_MILESTONE: 'Sprint 1'
          SPRINT_START: '2026-10-06' # CHANGE if your sprint began on another date
          SPRINT_END: '2026-10-27'
          SPRINT_TIMEZONE: 'Europe/Madrid'
        run: python scripts/burndown.py

      - name: Commit the updated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/burndown/sprint-1-burndown.png docs/burndown/sprint-1-burndown.csv
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update Sprint 1 burndown'
            git push
          fi
