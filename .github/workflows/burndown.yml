name: Sprint Burndown

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/burndown.yml'
      - 'scripts/burndown.py'

  workflow_dispatch:

  schedule:
    - cron: '07 19 * * *'
      timezone: 'Europe/Madrid'

  issues:
    types: [opened, closed, reopened, milestoned, demilestoned]

permissions:
  contents: write
  issues: read

concurrency:
  group: sprint-burndown
  cancel-in-progress: false

# Change only these values at the start of each sprint.
env:
  SPRINT_MILESTONE: 'Sprint 2'
  SPRINT_SLUG: 'sprint-2'
  SPRINT_START: '2026-10-28'
  SPRINT_END: '2026-11-22'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Generate burndown chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINT_TIMEZONE: 'Europe/Madrid'
          BURNDOWN_OUTPUT: 'docs/burndown'
        run: |
          set -euo pipefail

          echo "Generating burndown for ${SPRINT_MILESTONE} (${SPRINT_START} -> ${SPRINT_END})..."
          mkdir -p docs/burndown

          python -u -c "import runpy; m = runpy.run_path('scripts/burndown.py', run_name='burndown_debug'); assert callable(m.get('main')), 'ERROR: main() not found'; m['main']()"

          echo "Checking generated files..."
          ls -lah docs/burndown/

          test -s "docs/burndown/${SPRINT_SLUG}-burndown.png"
          test -s "docs/burndown/${SPRINT_SLUG}-burndown.csv"

      - name: Commit the updated reports
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -f "docs/burndown/${SPRINT_SLUG}-burndown.png"
          git add -f "docs/burndown/${SPRINT_SLUG}-burndown.csv"

          if ! git diff --cached --quiet; then
            git commit -m "docs: update ${SPRINT_MILESTONE} burndown"
            # dev may have moved while the job was running: rebase and retry.
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin "$(git branch --show-current)" && git push && exit 0
              echo "Push attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            echo "Could not push after 3 attempts" >&2
            exit 1
          else
            echo "No changes to commit."
          fi
