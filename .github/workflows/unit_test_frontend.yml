name: Frontend unit tests

on:
  push:
    branches:
      - dev
      - staging
      - prod
      - feature/47-sprint-1-devops-automation-workflows
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./agritwin-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agritwin-app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Jest unit tests with coverage
        run: npx jest __tests__ --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: agritwin-app/coverage/
          if-no-files-found: warn
