name: Backend + Frontend tests + SonarQube

on:
  push:
    branches:
      - dev
      #- staging
      - prod
  pull_request:
    branches: [dev, prod] #staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # BACKEND - PYTHON
      # -------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.4"

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Run backend unit tests
        working-directory: ./backend
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PRODUCTION: ${{ secrets.PRODUCTION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DSQL_HOST: ${{ secrets.DSQL_HOST }}
          REGION : ${{secrets.REGION}}
          OPENWEATHER_API_KEY: ${{secrets.OPENWEATHER_API_KEY}}
        run: >
            uv run pytest 
            -v --cov 
            --cov-report=term-missing 
            --cov-report=xml:coverage.xml
      # -------------------------
      # FRONTEND - REACT NATIVE
      # -------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agritwin-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./agritwin-app
        run: npm ci

      - name: Run frontend unit tests with coverage
        working-directory: ./agritwin-app
        run: npx jest __tests__ --coverage
      
      - name: Verify frontend coverage report
        working-directory: ./agritwin-app
        run: |
          ls -la coverage/
          test -s coverage/lcov.info
          head -n 10 coverage/lcov.info

      # -------------------------
      # SONARQUBE
      # -------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=agritwin-app/coverage/lcov.info
