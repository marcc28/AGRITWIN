name: Security Reports

on:
  push:
    branches:
      - security/128-api-security
    paths:
      - scripts/security/**
      - .github/workflows/security-report.yml
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-report:
    name: Generate execution report
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out evaluated revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create execution manifest
        run: python scripts/security/create_execution_manifest.py

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/manifest.json
          if-no-files-found: error
          retention-days: 30
