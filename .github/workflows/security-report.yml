name: Security Reports

on:
  push:
    branches:
      - security/128-api-security
      - dev
      - staging
      - prod
    paths:
      - scripts/security/**
      - .github/workflows/security-report.yml
      - backend/**
  pull_request:
    branches:
      - dev
      - staging
      - prod
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deployed-security-report
  cancel-in-progress: false

jobs:
  execution-report:
    name: Review deployed application
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out evaluated revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate reporting checks
        run: python -m unittest discover -s scripts/security/tests -v

      - name: Record deployment and read-only API coverage
        run: python scripts/security/deployed_security_report.py prepare

      - name: Run passive deployment scans
        id: zap
        continue-on-error: true
        run: bash scripts/security/run_deployed_zap.sh

      - name: Retrieve previous report for comparison
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          mkdir -p reports/previous
          previous_run=$(gh run list --workflow security-report.yml --branch "$REVIEW_BRANCH" --status success --limit 10 --json databaseId --jq ".[].databaseId | select(. != $GITHUB_RUN_ID)" | head -n 1)
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --pattern 'security-report-*' --dir reports/previous || printf 'Previous report is unavailable; comparison will be recorded as an initial snapshot.\n'
          fi

      - name: Generate HTML, JSON and sprint reports
        if: always()
        run: python scripts/security/deployed_security_report.py finalize

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/security/*.json
            reports/security/*.html
            reports/security/*.md
          if-no-files-found: error
          retention-days: 30

      - name: Check report execution status
        if: always()
        run: python scripts/security/deployed_security_report.py check
