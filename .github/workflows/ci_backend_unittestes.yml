
name: Backend unit tests and SonarQube

on:
  push:
    branches: ["dev", "staging", "prod"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.4"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Run tests and generate coverage
        working-directory: ./backend
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PRODUCTION: ${{ secrets.PRODUCTION }}
          LOCAL_DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}
          EXTERN_DATABASE_URL: ${{ secrets.EXTERN_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}
        run: uv run pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: error

  sonarqube:
    name: SonarQube analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
